services:
  mongodb:
    image: 'mongo:7'
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: '${MONGO_ROOT_PASSWORD}'
      MONGO_INITDB_DATABASE: sensor_monitoring
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: 'mongodb://admin:${MONGO_ROOT_PASSWORD}@mongodb:27017/sensor_monitoring?authSource=admin'
      CORS_ORIGIN: 'https://sensor.wilga.tech'
      # API-Key für geschützte Schreib-Endpunkte (Heizungssteuerung, Sensor-Ingestion)
      API_KEY: '${API_KEY}'
      RATE_LIMIT_WINDOW_MS: 900000
      # War 100 - reicht nicht: allein der ESP32 pollt 2 Plugs alle 5s (~24
      # Anfragen/Minute), dazu Sensor-/Config-Poll + das Dashboard selbst.
      RATE_LIMIT_MAX_REQUESTS: 3000
      # E-Mail-Benachrichtigungen (optional, siehe docs/07-EMAIL-BENACHRICHTIGUNGEN.md)
      EMAIL_SERVICE: '${EMAIL_SERVICE:-}'
      SMTP_HOST: '${SMTP_HOST:-}'
      SMTP_PORT: '${SMTP_PORT:-}'
      SMTP_SECURE: '${SMTP_SECURE:-}'
      EMAIL_USER: '${EMAIL_USER:-}'
      EMAIL_PASSWORD: '${EMAIL_PASSWORD:-}'
      EMAIL_TO: '${EMAIL_TO:-}'
      VERBRAUCH_SCHWELLENWERT: '${VERBRAUCH_SCHWELLENWERT:-12}'
      VERBRAUCH_CHECK_INTERVAL_MINUTES: '${VERBRAUCH_CHECK_INTERVAL_MINUTES:-60}'
      # Ziel-Komfortbereich für die Verbrauchsanalyse (nicht die Schaltschwellen!)
      TARGET_TEMP_MIN: '${TARGET_TEMP_MIN:-18}'
      TARGET_TEMP_MAX: '${TARGET_TEMP_MAX:-22}'
      TARGET_HUMIDITY_MIN: '${TARGET_HUMIDITY_MIN:-40}'
      TARGET_HUMIDITY_MAX: '${TARGET_HUMIDITY_MAX:-60}'
      # Harte Sicherheitsgrenze für die Testwoche (Experiment-Modus): Heizung
      # wird zwangsweise ausgeschaltet, sobald diese Temperatur erreicht ist -
      # unabhängig vom aktuellen Phasenplan.
      EXPERIMENT_MAX_TEMP: '${EXPERIMENT_MAX_TEMP:-26}'
      # Login fürs Dashboard (ersetzt den früheren nginx Basic-Auth-Dialog,
      # siehe backend/src/routes/authRoutes.js + frontend/src/LoginPage.jsx)
      DASHBOARD_USERNAME: '${DASHBOARD_USERNAME}'
      DASHBOARD_PASSWORD: '${DASHBOARD_PASSWORD}'
      # Signiert die Session-Cookies - mit z.B. `openssl rand -hex 32` erzeugen
      SESSION_SECRET: '${SESSION_SECRET}'
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: 'https://sensor-api.wilga.tech/api'
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  mongodb-data:
