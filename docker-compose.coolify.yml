services:
  mongodb:
    image: 'mongo:7'
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: '${SERVICE_PASSWORD_MONGO}'
      MONGO_INITDB_DATABASE: sensor_monitoring
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: 'mongodb://admin:${SERVICE_PASSWORD_MONGO}@mongodb:27017/sensor_monitoring?authSource=admin'
      CORS_ORIGIN: 'https://sensor.wilga.tech'
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100
      # E-Mail-Benachrichtigungen (optional, siehe docs/07-EMAIL-BENACHRICHTIGUNGEN.md)
      EMAIL_SERVICE: '${EMAIL_SERVICE:-}'
      SMTP_HOST: '${SMTP_HOST:-}'
      SMTP_PORT: '${SMTP_PORT:-}'
      SMTP_SECURE: '${SMTP_SECURE:-}'
      EMAIL_USER: '${EMAIL_USER:-}'
      EMAIL_PASSWORD: '${EMAIL_PASSWORD:-}'
      EMAIL_TO: '${EMAIL_TO:-}'
      VERBRAUCH_SCHWELLENWERT: '${VERBRAUCH_SCHWELLENWERT:-12}'
      VERBRAUCH_CHECK_INTERVAL_MINUTES: '${VERBRAUCH_CHECK_INTERVAL_MINUTES:-60}'
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: 'https://sensor-api.wilga.tech/api'
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  mongodb-data:
